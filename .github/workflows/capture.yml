# Captures YouTube live chat for @Guidegamer016 streams into data/<UTC-date>/<videoId>/
# - schedule: every 15 min, auto-detects a live stream and starts capturing it
# - workflow_dispatch: paste any live/replay YouTube link (gh CLI: gh workflow run capture.yml -f url=<link>)
# Output per video: chat.jsonl (ALL messages), claims.jsonl + owner_scan.txt (giftcode claims vs codes.json),
# chat_<admin>_admin_comments.txt (per-username admin dumps, same as local workflow).
name: capture
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      url:
        description: YouTube live/replay link (leave empty = auto-detect current live)
        required: false
permissions:
  contents: write
concurrency: capture   # one capture at a time; never cancel a running one

jobs:
  find:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.pick.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        env:
          URL: ${{ inputs.url }}
        run: |
          set -e
          if [ -n "$URL" ]; then
            vid=$(echo "$URL" | grep -oE '(v=|youtu\.be/|live/|shorts/)[A-Za-z0-9_-]{11}' | tail -1 | grep -oE '[A-Za-z0-9_-]{11}$')
            [ -z "$vid" ] && vid=$(echo "$URL" | grep -oE '^[A-Za-z0-9_-]{11}$')
            [ -n "$vid" ] || { echo "could not extract a video id from: $URL"; exit 1; }
            ids=$(jq -cn --arg v "$vid" '[$v]')
          else
            html=$(curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "https://www.youtube.com/@Guidegamer016/live" || true)
            if echo "$html" | grep -q '"isLiveNow"'; then
              ids=$(echo "$html" | grep -oE '"videoId":"[A-Za-z0-9_-]{11}"' | grep -oE '[A-Za-z0-9_-]{11}' | sort -u | head -4 | jq -R . | jq -sc)
              saved=$(git ls-tree -r --name-only HEAD -- data || true)   # skip already-captured streams (dispatch bypasses this)
              ids=$(jq -c --arg s "$saved" '[.[] | select(($s | index("/" + . + "/")) | not)]' <<<"$ids")
            else
              ids='[]'
            fi
          fi
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          echo "to capture: $ids"

  capture:
    needs: find
    if: needs.find.outputs.ids != '[]'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1   # serial, so the git commits never collide
      matrix:
        video: ${{ fromJSON(needs.find.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
      - name: pull chat   # hard cap 5h: longer streams lose the tail here — re-dispatch with the link once ended to get the full replay
        run: |
          mkdir -p out
          timeout 300m node ytchat.js pull "${{ matrix.video }}" -o out/chat.jsonl || echo "pull stopped: $?" > out/pull.err
          [ -s out/chat.jsonl ] || { cat out/pull.err 2>/dev/null; echo "no chat (replay not ready / captcha / disabled)"; exit 1; }
      - name: analyze
        run: |
          node ytchat.js scan out/chat.jsonl --owner --codes codes.json --claims-out out/claims.jsonl > out/owner_scan.txt
          node admin_comments.js out/chat.jsonl
      - name: commit into data/<date>/<videoId>/
        run: |
          DIR="data/$(date -u +%F)/${{ matrix.video }}"
          mkdir -p "$DIR" && cp -r out/* "$DIR"/
          git config user.name ytchat-bot && git config user.email ytchat-bot@users.noreply.github.com
          git add -f "$DIR"   # -f: our .gitignore also matches the data/ outputs
          git diff --cached -q || { git commit -qm "capture ${{ matrix.video }} ($(($(wc -l < "$DIR/chat.jsonl")-1)) msgs)"; git push; }
